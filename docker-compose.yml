version: '3.8'

services:
  # Next.js frontend application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./public:/app/public
      - /app/node_modules
    depends_on:
      - redis
      - supabase
    restart: unless-stopped
    networks:
      - climate-network

  # Python backend services
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    env_file:
      - .env
    volumes:
      - ./climate_economy_ecosystem:/app/climate_economy_ecosystem
      - ./graph:/app/graph
    depends_on:
      - supabase
      - redis
    networks:
      - climate-network

  # Redis for caching
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - climate-network

  # Supabase local development
  supabase:
    image: supabase/supabase-local:latest
    ports:
      - "8000:8000"  # API
      - "54322:5432" # Database
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-change-me}
      - ANON_KEY=${SUPABASE_ANON_KEY}
      - SERVICE_ROLE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - supabase-data:/var/lib/postgresql/data
      - ./tools/setup_database.sql:/docker-entrypoint-initdb.d/setup_database.sql
    restart: unless-stopped
    networks:
      - climate-network

  # Frontend test runner
  test-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./public:/app/public
      - ./__tests__:/app/__tests__
      - ./jest.config.js:/app/jest.config.js
      - ./jest.setup.js:/app/jest.setup.js
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=test
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=mock-openai-key
    depends_on:
      - supabase
    networks:
      - climate-network
    command: npm test

  # Python test runner
  test-python:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ./climate_economy_ecosystem:/app/climate_economy_ecosystem
      - ./graph:/app/graph
      - ./tests:/app/tests
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=mock-openai-key
    depends_on:
      - supabase
    networks:
      - climate-network
    command: pytest tests/

volumes:
  redis-data:
  supabase-data:

networks:
  climate-network:
    driver: bridge
