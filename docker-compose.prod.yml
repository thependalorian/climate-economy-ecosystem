version: '3.8'

services:
  # Next.js frontend application (production)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: always
    networks:
      - climate-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Python backend services (production)
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    env_file:
      - .env
    restart: always
    networks:
      - climate-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://frontend:3000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching (production)
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always
    networks:
      - climate-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Supabase local development
  supabase:
    image: supabase/supabase-local:latest
    ports:
      - "8000:8000"  # API
      - "54322:5432" # Database
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - ANON_KEY=${SUPABASE_ANON_KEY}
      - SERVICE_ROLE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - supabase-data:/var/lib/postgresql/data
      - ./tools/setup_database.sql:/docker-entrypoint-initdb.d/setup_database.sql
    restart: always
    networks:
      - climate-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
  supabase-data:

networks:
  climate-network:
    driver: bridge
